[package]
name = "wasmpdf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfium-render = { path = "../pdfium-render", default-features = false, features = ["pdfium_8125", "static", "thread_safe"] }
wasm-bindgen = "0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
