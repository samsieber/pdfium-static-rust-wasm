<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wasmpdf WASI shim probe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d232f;
      }

      main {
        width: min(680px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        font-weight: 650;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 10px 16px;
        margin: 0 0 20px;
        padding: 20px 0;
        border-top: 1px solid #c8ced8;
        border-bottom: 1px solid #c8ced8;
      }

      form {
        display: grid;
        gap: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      input[type="file"] {
        max-width: 100%;
      }

      input[type="number"] {
        width: 72px;
        min-height: 32px;
        padding: 0 8px;
        border: 1px solid #9aa4b2;
        border-radius: 6px;
        font: inherit;
      }

      button {
        width: fit-content;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid #9aa4b2;
        border-radius: 6px;
        background: #ffffff;
        color: #1d232f;
        font: inherit;
        font-weight: 650;
      }

      button:disabled {
        color: #6b7280;
      }

      dt {
        font-weight: 650;
      }

      dd {
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      .ok {
        color: #047857;
      }

      .error {
        color: #b42318;
        white-space: pre-wrap;
      }

      canvas {
        display: block;
        max-width: 100%;
        margin-top: 16px;
        border: 1px solid #c8ced8;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>wasmpdf WASI shim probe</h1>
      <dl>
        <dt>Package</dt>
        <dd id="version">loading</dd>
        <dt>Pdfium init</dt>
        <dd id="probe">pending</dd>
      </dl>
      <form id="pdf-form">
        <input id="pdf-file" type="file" accept="application/pdf,.pdf" />
        <div class="actions">
          <button id="count-pages" type="submit" disabled>Count pages twice</button>
          <button id="use-sample" type="button" disabled>Use sample PDF</button>
        </div>
      </form>
      <dl>
        <dt>First call</dt>
        <dd id="first-count">waiting</dd>
        <dt>Second call</dt>
        <dd id="second-count">waiting</dd>
        <dt>Rendered page</dt>
        <dd id="render-status">waiting</dd>
        <dt>Data URL</dt>
        <dd id="data-url-status">waiting</dd>
      </dl>
      <div class="actions">
        <label>
          Page
          <input id="page-number" type="number" min="1" value="1" disabled />
        </label>
        <button id="render-page" type="button" disabled>Render page</button>
      </div>
      <canvas id="page-canvas" hidden></canvas>
    </main>
    <script type="module">
      const version = document.querySelector("#version");
      const probe = document.querySelector("#probe");
      const form = document.querySelector("#pdf-form");
      const fileInput = document.querySelector("#pdf-file");
      const countButton = document.querySelector("#count-pages");
      const sampleButton = document.querySelector("#use-sample");
      const firstCount = document.querySelector("#first-count");
      const secondCount = document.querySelector("#second-count");
      const renderStatus = document.querySelector("#render-status");
      const dataUrlStatus = document.querySelector("#data-url-status");
      const pageNumber = document.querySelector("#page-number");
      const renderButton = document.querySelector("#render-page");
      const pageCanvas = document.querySelector("#page-canvas");

      let pdfiumPageCount = null;
      let pdfiumRenderPageRgba = null;
      let activeLoadBytes = null;

      function showError(target, error) {
        target.textContent = error && error.stack ? error.stack : String(error);
        target.className = "error";
      }

      function showPageCount(target, count) {
        target.textContent = `${count} page${count === 1 ? "" : "s"}`;
        target.className = "ok";
      }

      async function renderSelectedPage() {
        if (!activeLoadBytes || !pdfiumRenderPageRgba) {
          return;
        }

        renderStatus.textContent = "rendering";
        renderStatus.className = "";
        dataUrlStatus.textContent = "waiting";
        dataUrlStatus.className = "";

        try {
          const selectedPageIndex = Number(pageNumber.value) - 1;
          const rendered = pdfiumRenderPageRgba(
            await activeLoadBytes(),
            selectedPageIndex,
            900,
          );
          const width = rendered.width;
          const height = rendered.height;
          let rgba;
          try {
            rgba = rendered.bytes();
          } finally {
            rendered.free();
          }
          const context = pageCanvas.getContext("2d");

          pageCanvas.width = width;
          pageCanvas.height = height;
          context.putImageData(
            new ImageData(new Uint8ClampedArray(rgba), width, height),
            0,
            0,
          );
          pageCanvas.hidden = false;

          renderStatus.textContent = `${pageNumber.value} (${width}x${height})`;
          renderStatus.className = "ok";

          const dataUrl = pageCanvas.toDataURL("image/png");
          dataUrlStatus.textContent = `${dataUrl.length} chars`;
          dataUrlStatus.className = "ok";
        } catch (error) {
          showError(renderStatus, error);
        }
      }

      async function countPagesTwice(loadBytes) {
        activeLoadBytes = loadBytes;
        firstCount.textContent = "running";
        firstCount.className = "";
        secondCount.textContent = "running";
        secondCount.className = "";
        renderStatus.textContent = "waiting";
        renderStatus.className = "";
        dataUrlStatus.textContent = "waiting";
        dataUrlStatus.className = "";
        renderButton.disabled = true;
        pageNumber.disabled = true;
        pageCanvas.hidden = true;

        try {
          const pageCount = pdfiumPageCount(await loadBytes());
          showPageCount(firstCount, pageCount);
          pageNumber.max = String(pageCount);
          pageNumber.value = String(Math.min(Number(pageNumber.value) || 1, pageCount));
          pageNumber.disabled = false;
          renderButton.disabled = false;
          await renderSelectedPage();
          showPageCount(secondCount, pdfiumPageCount(await loadBytes()));
        } catch (error) {
          showError(secondCount, error);
        }
      }

      try {
        const {
          default: init,
          pdfium_page_count,
          pdfium_render_page_rgba,
          pdfium_static_init_probe,
          wasmpdf_version,
        } = await import("./pkg-wasi-probe/wasmpdf.js");
        await init();
        pdfiumPageCount = pdfium_page_count;
        pdfiumRenderPageRgba = pdfium_render_page_rgba;
        version.textContent = wasmpdf_version();
        const ok = pdfium_static_init_probe();
        probe.textContent = ok ? "initialized" : "failed";
        probe.className = ok ? "ok" : "error";
        countButton.disabled = !ok;
        sampleButton.disabled = !ok;
      } catch (error) {
        version.textContent = "failed";
        showError(probe, error);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const file = fileInput.files[0];
        if (!file || !pdfiumPageCount) {
          return;
        }

        await countPagesTwice(async () => new Uint8Array(await file.arrayBuffer()));
      });

      sampleButton.addEventListener("click", async () => {
        if (!pdfiumPageCount) {
          return;
        }

        await countPagesTwice(async () => {
          const response = await fetch("./files/test1.pdf");
          return new Uint8Array(await response.arrayBuffer());
        });
      });

      renderButton.addEventListener("click", renderSelectedPage);
    </script>
  </body>
</html>
