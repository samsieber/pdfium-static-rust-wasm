<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wasmpdf smoke test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d232f;
      }

      main {
        width: min(560px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        font-weight: 650;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 10px 16px;
        margin: 0;
        padding: 20px 0;
        border-top: 1px solid #c8ced8;
        border-bottom: 1px solid #c8ced8;
      }

      dt {
        font-weight: 650;
      }

      dd {
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      .ok {
        color: #047857;
      }

      .error {
        color: #b42318;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>wasmpdf smoke test</h1>
      <dl>
        <dt>Package</dt>
        <dd id="version">loading</dd>
        <dt>Pdfium init</dt>
        <dd id="probe">pending</dd>
      </dl>
    </main>
    <script type="module">
      const version = document.querySelector("#version");
      const probe = document.querySelector("#probe");

      try {
        const {
          default: init,
          pdfium_static_init_probe,
          wasmpdf_version,
        } = await import("./pkg/wasmpdf.js");
        await init();
        version.textContent = wasmpdf_version();
        const ok = pdfium_static_init_probe();
        probe.textContent = ok ? "initialized" : "failed";
        probe.className = ok ? "ok" : "error";
      } catch (error) {
        version.textContent = "failed";
        probe.textContent = error && error.stack ? error.stack : String(error);
        probe.className = "error";
      }
    </script>
  </body>
</html>
